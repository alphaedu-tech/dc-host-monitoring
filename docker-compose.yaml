# Логи контейнеров ротируются: 100 МБ x 10 файлов, потолок 1 ГБ на сервис.
# 2026-08-21 promtail не смог отдать логи в loki («at least one label pair is
# required per stream»), ретраил без остановки и записал об этом 11 ГБ в
# собственный json.log; loki добавил 5.5 ГБ своих 400-х. Диск тестового хоста
# ушёл под 100%, и на нём встал деплой LMS: pre-deploy бэкап не смог записать
# копию в MinIO. Ротации не было ни здесь, ни в /etc/docker/daemon.json —
# то есть любой шумный контейнер мог повторить это, не только promtail.
services:
  prometheus:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    build:
      context: .
      dockerfile_inline: |
        FROM prom/prometheus:latest
        COPY ./prometheus/prometheus.yml /etc/prometheus/
        USER root
        RUN mkdir -p /prometheus && \
            chown -R nobody:nobody /prometheus
        USER nobody
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./.docker_volumes/prometheus/data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    user: nobody:nobody

  grafana:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./.docker_volumes/grafana/data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    user: "472"

  node:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    restart: unless-stopped

  cadvisor:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    image: gcr.io/cadvisor/cadvisor:latest
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    image: grafana/loki:2.9.13
    user: root
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - ./.docker_volumes/loki/data:/loki
      - ./.docker_volumes/loki/wal:/wal
      - ./.docker_volumes/loki/compactor:/loki/compactor
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    restart: unless-stopped

  promtail:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    image: grafana/promtail:2.8.2
    volumes:
      - /var/log:/var/log:ro
      - ./imported_logs:/imported_logs:ro
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: unless-stopped

  alertmanager:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    image: prom/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager
    restart: unless-stopped
