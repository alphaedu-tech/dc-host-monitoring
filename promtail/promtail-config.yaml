# promtail/promtail-config.yaml
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Метка, которую получает КАЖДЫЙ поток на выходе клиента, чем бы он ни был
    # собран. Точечных меток по джобам недостаточно: Loki отвергает батч целиком,
    # если хотя бы один поток в нём остался без меток, — и тогда теряются заодно
    # все нормальные записи этого батча. Метрика loki_discarded_samples_total
    # показывала reason="missing_labels" при том, что в самом Loki все видимые
    # потоки размечены: виновника снаружи не видно, он не доезжает по определению.
    # external_labels закрывает весь класс, а не найденный экземпляр.
    # Константа, а не ${HOSTNAME}: promtail запускается без -config.expand-env,
    # переменная попала бы в метку литералом. Стенды различаются своим Loki, так
    # что имя хоста здесь ничего не добавляет — задача метки в том, чтобы она была.
    external_labels:
      source: promtail

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Постоянная метка потока. Без неё у docker-джоба меток нет вовсе: в отличие
      # от static_configs выше, `job_name` сам меткой не становится, а `container`
      # и `stream` ниже берутся из мета-полей и бывают пустыми. Поток без единой
      # метки Loki отклоняет — «at least one label pair is required per stream», —
      # promtail ретраит его без остановки и пишет об этом в свой лог: 11 ГБ на
      # alphaedu-test 21.08 и по 5 миллионов таких строк на обоих продах.
      - target_label: "job"
        replacement: "docker"

      # Extract container name
      - source_labels: ["__meta_docker_container_name"]
        target_label: "container"

      # Extract log stream (stdout/stderr)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"

      # Drop monitoring containers (those with 'hm-' prefix)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/dc-host-monitoring-.*"
        action: drop

  - job_name: imported_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: imported_logs
          __path__: /imported_logs/*.log
